name: Build Pocket Alex APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The private signing key lives only in GitHub Actions Secrets.
      # Every future build uses the same key, so Android can update Pocket Alex in place.
      - name: Install permanent Pocket Alex signing key
        env:
          POCKET_ALEX_KEYSTORE_BASE64: ${{ secrets.POCKET_ALEX_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$POCKET_ALEX_KEYSTORE_BASE64" ]; then
            echo "Missing POCKET_ALEX_KEYSTORE_BASE64 repository secret."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$POCKET_ALEX_KEYSTORE_BASE64" | base64 --decode > ~/.android/debug.keystore
          keytool -list -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey >/dev/null

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Pocket Alex APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Alex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
