name: Build Pocket Alex APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # Keep the same debug signing key between GitHub Actions runs so
      # future Pocket Alex builds can update the app already on Esther's phone.
      - name: Restore Pocket Alex signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pocket-alex-debug-signing-v1

      - name: Ensure Android debug signing key exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Pocket Alex Debug,O=Pocket Alex,C=TW"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload Pocket Alex APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Alex-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
